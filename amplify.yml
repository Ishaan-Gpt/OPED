version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        - pnpm run build
        - mkdir -p .output/public
        - if [ -d .amplify-hosting/static ]; then cp -r .amplify-hosting/static/* .output/public/; fi
  artifacts:
    baseDirectory: .output/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

